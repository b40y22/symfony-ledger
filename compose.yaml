# Core stack. Future profiles: `sim` (ledger simulator), `observability` (Prometheus/Grafana).
# Host ports are overridable from the shell, e.g. `HTTP_PORT=8091 make up`.
services:

  nginx:
    image: nginx:1.29-alpine
    container_name: ledger-nginx
    depends_on:
      - php
    ports:
      - "${HTTP_PORT:-8090}:80"
    volumes:
      - ./public:/var/www/app/public:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - ledger_network
    restart: unless-stopped

  php:
    build:
      context: ./docker/php
      args:
        HOST_UID: ${HOST_UID:-1000}
        HOST_GID: ${HOST_GID:-1000}
    container_name: ledger-php
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    volumes:
      - .:/var/www/app
      - composer_cache:/home/app/.composer/cache
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - ledger_network
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    container_name: ledger-postgres
    environment:
      POSTGRES_DB: ledger
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docker/postgres/init-test-db.sh:/docker-entrypoint-initdb.d/init-test-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - ledger_network
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: ledger-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ledger
      RABBITMQ_DEFAULT_PASS: ledger
    ports:
      - "${RABBITMQ_UI_PORT:-15673}:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 10s
      retries: 10
    networks:
      - ledger_network
    restart: unless-stopped

volumes:
  postgres_data:
  rabbitmq_data:
  composer_cache:

networks:
  ledger_network:
    name: ledger_network
