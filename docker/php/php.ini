memory_limit = 512M
date.timezone = UTC

opcache.enable = 1
opcache.enable_cli = 0
; Dev: re-check file timestamps on every request so edits apply without a restart.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0

; Xdebug is installed but off; enable per run with XDEBUG_MODE=debug or coverage.
xdebug.mode = off
xdebug.client_host = host.docker.internal
